{% extends "base.html" %}

{% block title %}404 - Page Not Found - DocPulse{% endblock %}

{% block content %}
<div class="container py-5 text-center my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="display-1 fw-bold text-primary mb-3">404</div>
            <h3 class="fw-bold mb-3">Healthcare Resource Not Found</h3>
            <p class="text-muted mb-4">
                The doctor profile, slot, or page you were searching for might have moved or is no longer available.
            </p>
            <div class="d-flex justify-content-center gap-2">
                <a href="{% url 'home' %}" class="btn btn-doc-primary">
                    <i class="fa-solid fa-house me-1"></i> Return to Home
                </a>
                <a href="{% url 'search' %}" class="btn btn-doc-outline">
                    <i class="fa-solid fa-magnifying-glass me-1"></i> Search Doctors
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
